<!DOCTYPE html>
<!--
  File name : public/customers.html
  Purpose   : Manage the customer list: search by name or phone, add a new
              customer, edit one and delete one (with a confirmation).
  Connects  : Loads css/style.css and the shared js/api.js, js/auth.js and
              js/ui.js. Its own logic lives in js/customers.js, which calls
              GET/POST/PUT/DELETE /api/customers.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customers | Cathy Luxe Collections</title>

  <!-- ===== Stylesheets (Bootstrap + Bootstrap Icons + Google Fonts + theme) ===== -->
  <link href="vendor/bootstrap.min.css" rel="stylesheet" />
  <link href="vendor/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="vendor/fonts.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- ===== NAVBAR (injected by ui.js) ===== -->
  <header id="appNavbar"></header>

  <!-- ===== PAGE CONTENT ===== -->
  <main class="page-main">
    <div class="container">

      <!-- ===== PAGE HEADER ===== -->
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <div>
          <h1 class="page-title h3">Customers</h1>
          <p class="page-subtitle">Keep track of who buys your perfumes.</p>
        </div>
        <button type="button" class="btn btn-gold rounded-pill px-3" id="addCustomerButton">
          <i class="bi bi-person-plus me-1"></i>Add Customer
        </button>
      </div>

      <!-- ===== SEARCH BAR ===== -->
      <div class="card-soft mb-4">
        <div class="card-body">
          <label class="form-label" for="customerSearchInput">Search customers</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="customerSearchInput" placeholder="Name or phone number" />
          </div>
        </div>
      </div>

      <!-- ===== CUSTOMER TABLE ===== -->
      <div class="card-soft">
        <div class="card-header">
          <i class="bi bi-people me-1"></i>Customer list
          <span class="text-muted-soft fw-normal" id="customerCountHint"></span>
        </div>
        <div class="card-body p-0" id="customerTableContainer">
          <!-- customers.js fills this with a loading spinner, the table or an empty state. -->
        </div>
      </div>

      <!-- ===== PAGINATION ===== -->
      <nav class="mt-4" aria-label="Customer pages" id="paginationContainer"></nav>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="app-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span><i class="bi bi-flower1 footer-gold me-1"></i>Cathy Luxe Collections</span>
      <span>Made for small perfume businesses.</span>
    </div>
  </footer>

  <!-- ===== ADD / EDIT MODAL ===== -->
  <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="customerForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="customerModalTitle">Add customer</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="customerId" />

            <div class="mb-3">
              <label class="form-label" for="customerName">Full name</label>
              <input type="text" class="form-control" id="customerName" required />
              <div class="invalid-feedback">Please enter the customer's name.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="customerPhone">Phone number</label>
              <input type="tel" class="form-control" id="customerPhone" placeholder="0770123456" required />
              <div class="invalid-feedback">Please enter a phone number.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="customerEmail">Email (optional)</label>
              <input type="email" class="form-control" id="customerEmail" placeholder="name@example.com" />
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="mb-0">
              <label class="form-label" for="customerPreferences">Favourite scents (optional)</label>
              <input type="text" class="form-control" id="customerPreferences" placeholder="Oud, rose, vanilla" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-gold px-4" id="customerSaveButton">
              <i class="bi bi-save me-1"></i>Save customer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
