<!DOCTYPE html>
<!--
  File name : public/orders.html
  Purpose   : Manage sales: list the orders with filters, create a new order
              with several product lines, view and print a receipt, share it
              on WhatsApp, edit it, cancel it (which returns the stock) and
              delete it.
  Connects  : Loads css/style.css and the shared js/api.js, js/auth.js and
              js/ui.js. Its own logic lives in js/orders.js, which calls the
              /api/orders endpoints plus /api/customers and /api/products.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders | Cathy Luxe Collections</title>

  <!-- ===== Stylesheets (Bootstrap + Bootstrap Icons + Google Fonts + theme) ===== -->
  <link href="vendor/bootstrap.min.css" rel="stylesheet" />
  <link href="vendor/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="vendor/fonts.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- ===== NAVBAR (injected by ui.js) ===== -->
  <header id="appNavbar"></header>

  <!-- ===== PAGE CONTENT ===== -->
  <main class="page-main">
    <div class="container">

      <!-- ===== PAGE HEADER ===== -->
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <div>
          <h1 class="page-title h3">Orders</h1>
          <p class="page-subtitle">Record every sale and keep the stock correct.</p>
        </div>
        <button type="button" class="btn btn-gold rounded-pill px-3" id="newOrderButton">
          <i class="bi bi-cart-plus me-1"></i>New Order
        </button>
      </div>

      <!-- ===== FILTER BAR ===== -->
      <div class="card-soft mb-4">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-6 col-md-3">
              <label class="form-label" for="statusFilter">Status</label>
              <select class="form-select" id="statusFilter">
                <option value="">All</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>

            <div class="col-6 col-md-3">
              <label class="form-label" for="fromDateFilter">From date</label>
              <input type="date" class="form-control" id="fromDateFilter" />
            </div>

            <div class="col-6 col-md-3">
              <label class="form-label" for="toDateFilter">To date</label>
              <input type="date" class="form-control" id="toDateFilter" />
            </div>

            <div class="col-6 col-md-3 d-grid">
              <button type="button" class="btn btn-outline-plum" id="clearOrderFiltersButton">
                <i class="bi bi-x-circle me-1"></i>Clear
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== ORDERS TABLE ===== -->
      <div class="card-soft">
        <div class="card-header">
          <i class="bi bi-receipt me-1"></i>Order list
          <span class="text-muted-soft fw-normal" id="orderCountHint"></span>
        </div>
        <div class="card-body p-0" id="ordersTableContainer">
          <!-- orders.js fills this with a loading spinner, the table or an empty state. -->
        </div>
      </div>

      <!-- ===== PAGINATION ===== -->
      <nav class="mt-4" aria-label="Order pages" id="paginationContainer"></nav>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="app-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span><i class="bi bi-flower1 footer-gold me-1"></i>Cathy Luxe Collections</span>
      <span>Made for small perfume businesses.</span>
    </div>
  </footer>

  <!-- ===== NEW / EDIT ORDER MODAL ===== -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="orderForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="orderModalTitle">New order</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="orderId" />

            <div class="mb-3">
              <label class="form-label" for="orderCustomer">Customer</label>
              <select class="form-select" id="orderCustomer" required>
                <option value="">Choose a customer...</option>
              </select>
              <div class="invalid-feedback">Please choose the customer for this sale.</div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label mb-0">Items</label>
              <button type="button" class="btn btn-sm btn-outline-plum rounded-pill" id="addOrderLineButton">
                <i class="bi bi-plus-lg me-1"></i>Add item
              </button>
            </div>

            <!-- One row per product line is added here by orders.js. -->
            <div id="orderItemsContainer"></div>

            <div class="mb-3">
              <label class="form-label" for="orderNote">Note (optional)</label>
              <input type="text" class="form-control" id="orderNote" placeholder="Gift wrap, delivery..." />
            </div>

            <!-- ===== LIVE RUNNING TOTAL ===== -->
            <div class="d-flex justify-content-between align-items-center p-3 rounded" style="background-color: rgba(201, 162, 77, 0.12);">
              <span class="fw-semibold">Order total</span>
              <span class="fs-5 fw-bold" id="orderTotalDisplay">UGX 0</span>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-gold px-4" id="orderSaveButton">
              <i class="bi bi-save me-1"></i>Save order
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== RECEIPT MODAL ===== -->
  <div class="modal fade" id="receiptModal" tabindex="-1" aria-labelledby="receiptModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="receiptModalTitle">Receipt</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="receiptModalBody">
          <!-- orders.js fills this with the receipt sheet. -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-success rounded-pill px-3" id="shareWhatsAppButton">
            <i class="bi bi-whatsapp me-1"></i>Share on WhatsApp
          </button>
          <button type="button" class="btn btn-plum rounded-pill px-3" id="printReceiptButton">
            <i class="bi bi-printer me-1"></i>Print
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== PRINT-ONLY AREA =====
       The theme's print stylesheet hides the whole page and shows only this
       element, so printing always produces just the receipt. -->
  <div id="printArea"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
